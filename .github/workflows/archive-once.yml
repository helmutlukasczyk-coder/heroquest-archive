name: One-time HeroQuest image archive
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-once.yml']
permissions:
  contents: write
jobs:
  archive:
    if: github.repository == 'helmutlukasczyk-coder/heroquest-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Copy originals and verify blob hashes
        run: python 2026-10-28/transfer.py
      - name: Commit verified originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026-10-28
          git diff --cached --quiet && exit 0
          git commit -m "Archive 34 unused images with original bytes and filenames"
          git push origin HEAD:main
